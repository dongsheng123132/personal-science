name: promote

on:
  schedule:
    # UTC 23:30 = 北京 07:30，紧跟 06:17 的 collect 之后
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只挑不提交"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  # ① 生成：会读外部文本、会调模型；**没有合并权限**
  generate:
    runs-on: ubuntu-latest
    outputs:
      auto_merge: ${{ steps.dec.outputs.auto_merge }}
      pr: ${{ steps.dec.outputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 生成实验页 + 两段式风险评审（不合并）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PS_LLM_BASE: ${{ vars.PS_LLM_BASE }}
          PS_LLM_MODEL: ${{ vars.PS_LLM_MODEL }}
          PS_SCREEN_MODEL: ${{ vars.PS_SCREEN_MODEL }}
          PS_RISK_MODEL: ${{ vars.PS_RISK_MODEL }}
          PS_RISK_BASE: ${{ vars.PS_RISK_BASE }}
          PS_RISK_KEY: ${{ secrets.PS_RISK_KEY }}
          PS_LLM_KEY: ${{ secrets.PS_LLM_KEY }}
        run: |
          set -e
          if [ -z "$PS_LLM_KEY" ]; then
            echo "没有 PS_LLM_KEY，跳过自动转正"
            exit 0
          fi
          git config --global user.name "ps-bot"
          git config --global user.email "ps-bot@users.noreply.github.com"
          gh auth setup-git
          git fetch --quiet origin main || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -X utf8 collector/promote.py --dry-run
          else
            python -X utf8 collector/promote.py --no-merge
          fi

      - name: 导出决策（失败则视为不可合并）
        id: dec
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("/tmp/promote-decision.json")
          d = json.loads(p.read_text()) if p.exists() else {}
          print("auto_merge=%s" % ("true" if d.get("auto_merge") else "false"))
          print("pr=%s" % (d.get("pr") or ""))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promote-decision
          path: /tmp/promote-decision.json
          if-no-files-found: ignore

  # ② 合并：**不跑任何模型、不读外部文本**，只校验结构化决策再合并
  merge:
    needs: generate
    if: needs.generate.outputs.auto_merge == 'true' && needs.generate.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promote-decision
          path: /tmp/decision

      - name: 二次校验（fail-closed）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("/tmp/decision/promote-decision.json").read_text())
          ok = (d.get("auto_merge") is True and d.get("risk_level") == "low"
                and d.get("verdict") == "approve" and not d.get("hard_block"))
          print("决策:", json.dumps(d, ensure_ascii=False))
          if not ok:
              print("不满足自动合并条件，退出（PR 保留给人工）")
              sys.exit(1)
          PY
          PR="${{ needs.generate.outputs.pr }}"

          # 只有全部检查 SUCCESS 才放行；其余一律不合并、非零退出（fail-closed）
          deny() {
            echo "::error::$1"
            echo "不合并（fail-closed）：$1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### promote 合并闸门：未合并（fail-closed）"
                echo ""
                echo "- PR：#$PR"
                echo "- 原因：$1"
                echo "- 最后一次检查状态：\`${states:-<空>}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          }

          states=""
          for i in $(seq 1 20); do
            # 相邻隐患：PR 已被关掉/合并时立刻收工，不要空转 20×20s 再去 merge 一个已关闭的 PR
            pr_state=$(gh pr view "$PR" --json state --jq '.state' 2>/dev/null || true)
            [ "$pr_state" = "OPEN" ] || deny "PR 状态是 ${pr_state:-未知}（不是 OPEN），停止等待检查"

            states=$(gh pr checks "$PR" --json state --jq '[.[].state]|unique|join(",")' || true)
            echo "checks: ${states:-<空>}（第 $i/20 次）"

            # 唯一的放行出口
            if [ "$states" = "SUCCESS" ]; then
              echo "全部检查 SUCCESS，放行"
              break
            fi

            # 终态失败再等也不会变绿，立刻停
            case ",$states," in
              *,FAILURE,*|*,CANCELLED,*|*,TIMED_OUT,*|*,STARTUP_FAILURE,*|*,ACTION_REQUIRED,*)
                deny "检查未通过：${states}" ;;
            esac

            if [ "$i" -lt 20 ]; then
              sleep 20
            fi
          done

          # 兜底：不依赖上面的循环逻辑，最后再确认一次，不是 SUCCESS 就绝不往下走
          if [ "${states:-}" != "SUCCESS" ]; then
            deny "轮询结束仍未全部 SUCCESS（最后状态：${states:-<空>}），超时或没拿到检查结果"
          fi

          gh pr merge "$PR" --squash --delete-branch
