name: collect

on:
  schedule:
    # 每天 UTC 22:17（北京 06:17）。GitHub 的 runner 在美国，等于自带一台美国服务器。
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    concurrency:
      group: collect
      # 同一时刻只允许一条在跑；新任务进来就取消旧的，避免两条抢着提交 JSON
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 采集
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 这三个是可选的：配了就用 AI 写"推荐理由"，没配就用规则生成
          PS_LLM_BASE: ${{ vars.PS_LLM_BASE }}
          PS_LLM_MODEL: ${{ vars.PS_LLM_MODEL }}
          PS_LLM_KEY: ${{ secrets.PS_LLM_KEY }}
        run: python collector/collect.py

      # 没配 key 会自动跳过（退出码 0）；配了 key 但调用失败/解析失败会退出码 1，让这一步变红
      - name: AI 筛选（没配 PS_LLM_KEY 会自动跳过）
        env:
          PS_LLM_BASE: ${{ vars.PS_LLM_BASE }}
          PS_LLM_MODEL: ${{ vars.PS_LLM_MODEL }}
          PS_LLM_KEY: ${{ secrets.PS_LLM_KEY }}
        run: python collector/triage.py

      - name: AI 设计实验方案（没配 PS_LLM_KEY 会自动跳过）
        env:
          PS_LLM_BASE: ${{ vars.PS_LLM_BASE }}
          PS_LLM_MODEL: ${{ vars.PS_LLM_MODEL }}
          PS_LLM_KEY: ${{ secrets.PS_LLM_KEY }}
        run: python collector/design.py --top 2

      # 无论 AI 是否失败，都提交采集到的数据；AI 失败时上一步会变红，这里照样把 raw/feed 存下来
      - name: 提交
        if: ${{ !cancelled() }}
        run: |
          git config user.name "ps-bot"
          git config user.email "ps-bot@users.noreply.github.com"
          git add inbox feed collector/seen.json
          if git diff --staged --quiet; then
            echo "今天没有新内容"
            exit 0
          fi
          git commit -m "collect: $(date -u +%F)"
          # push 被拒说明另一条任务刚提交过（生成的是同一份数据）。
          # 先 abort 掉可能残留的 rebase，再重试；实在冲突就放弃本轮，别把仓库卡在 detached HEAD。
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒，rebase 后重试（$i/3）"
            git rebase --abort >/dev/null 2>&1 || true
            if ! git pull --rebase -X theirs; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "本轮数据与远程冲突；远程已有今天的提交，放弃本轮（不算失败）"
              exit 0
            fi
            sleep 3
          done
          echo "推送失败" >&2
          exit 1
